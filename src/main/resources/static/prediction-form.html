<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diamond Prediction Input</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select {
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input[readonly] {
            background: #eef3f8;
            font-weight: bold;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .actions {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .result {
            margin-top: 30px;
            background: #f7f9fb;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Diamond Prediction Input</h1>

    <div class="grid">
        <div class="field">
            <label for="carat">carat (0.2 - 5.01)</label>
            <input type="number" id="carat" min="0.2" max="5.01" step="0.01">
        </div>

        <div class="field">
            <label for="cut">cut</label>
            <select id="cut">
                <option value="Fair">Fair</option>
                <option value="Good">Good</option>
                <option value="Very Good">Very Good</option>
                <option value="Premium">Premium</option>
                <option value="Ideal">Ideal</option>
            </select>
        </div>

        <div class="field">
            <label for="color">color</label>
            <select id="color">
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
                <option value="I">I</option>
                <option value="J">J</option>
            </select>
        </div>

        <div class="field">
            <label for="clarity">clarity</label>
            <select id="clarity">
                <option value="I1">I1</option>
                <option value="SI2">SI2</option>
                <option value="SI1">SI1</option>
                <option value="VS2">VS2</option>
                <option value="VS1">VS1</option>
                <option value="VVS2">VVS2</option>
                <option value="VVS1">VVS1</option>
                <option value="IF">IF</option>
            </select>
        </div>

        <div class="field">
            <label for="depth">depth (43 - 79)</label>
            <input type="number" id="depth" min="43" max="79" step="0.01">
        </div>

        <div class="field">
            <label for="table">table (43 - 95)</label>
            <input type="number" id="table" min="43" max="95" step="0.01">
        </div>

        <div class="field">
            <label for="x">x (0.1 - 10.7)</label>
            <input type="number" id="x" min="0.1" max="10.7" step="0.01">
        </div>

        <div class="field">
            <label for="y">y (0 - 58.9)</label>
            <input type="number" id="y" min="0" max="58.9" step="0.01">
        </div>

        <div class="field">
            <label for="z">z (0 - 31.8)</label>
            <input type="number" id="z" min="0" max="31.8" step="0.01">
        </div>

        <div class="field">
            <label for="predictedPrice">Predicted price</label>
            <input type="text" id="predictedPrice" readonly placeholder="Prediction result will appear here">
        </div>
    </div>

    <div class="actions">
        <button onclick="submitPredictionInput()">Predict</button>
    </div>

    <div class="result" id="result">No data submitted yet.</div>
</div>

<script>
    function getNumberValue(id) {
        const value = document.getElementById(id).value;
        return value === "" ? null : parseFloat(value);
    }

    async function submitPredictionInput() {
        const payload = {
            carat: getNumberValue("carat"),
            cut: document.getElementById("cut").value,
            color: document.getElementById("color").value,
            clarity: document.getElementById("clarity").value,
            depth: getNumberValue("depth"),
            table: getNumberValue("table"),
            x: getNumberValue("x"),
            y: getNumberValue("y"),
            z: getNumberValue("z")
        };

        document.getElementById("result").textContent =
            "Sending payload:\n" + JSON.stringify(payload, null, 2);

        try {
            const response = await fetch("/api/prediction-input", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const responseData = await response.json();

            document.getElementById("result").textContent =
                "Server response:\n" + JSON.stringify(responseData, null, 2);

            // Placeholder until real prediction logic is added
            document.getElementById("predictedPrice").value =
                "Prediction not implemented yet";
        } catch (error) {
            document.getElementById("result").textContent =
                "Error while sending request:\n" + error;
            document.getElementById("predictedPrice").value = "Error";
        }
    }
</script>
</body>
</html>
