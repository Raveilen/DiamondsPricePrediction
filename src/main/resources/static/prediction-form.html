<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diamond Prediction Input</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: url('diamonds-bg.jpg') center center / cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background: rgba(10, 10, 30, 0.82);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 32px;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }

        nav .brand {
            color: #e0e8ff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 0.04em;
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav .brand span { font-size: 1.3rem; }

        nav a {
            color: #c9d6ff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: background 0.18s, color 0.18s;
        }

        nav a:hover { background: rgba(255,255,255,0.12); color: #fff; }
        nav a.active { background: rgba(100,140,255,0.28); color: #fff; font-weight: bold; }

        .page-content {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 32px 24px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(4px);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        h1 { text-align: center; margin-bottom: 30px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; }

        input, select {
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: rgba(255,255,255,0.95);
        }

        input[readonly] { background: #eef3f8; font-weight: bold; }

        .actions { margin-top: 30px; text-align: center; display: flex; justify-content: center; gap: 12px; }

        button {
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.18s;
        }

        .btn-predict { background: #1565c0; }
        .btn-predict:hover { background: #0d47a1; }
        .btn-clear { background: rgba(180,30,30,0.80); }
        .btn-clear:hover { background: rgba(180,30,30,1); }

        .result {
            margin-top: 30px;
            background: #f7f9fb;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>

<nav>
    <div class="brand"><span>💎</span> Diamonds Price Prediction</div>
    <a href="/index.html">Dashboard</a>
    <a href="/prediction-form.html" class="active">Predict Price</a>
</nav>

<div class="page-content">
    <div class="container">
        <h1>Diamond Prediction Input</h1>

        <div class="grid">
            <div class="field">
                <label for="carat">carat (0.2 - 5.01)</label>
                <input type="number" id="carat" min="0.2" max="5.01" step="0.01">
            </div>
            <div class="field">
                <label for="cut">cut</label>
                <select id="cut">
                    <option value="Fair">Fair</option>
                    <option value="Good">Good</option>
                    <option value="Very Good">Very Good</option>
                    <option value="Premium">Premium</option>
                    <option value="Ideal">Ideal</option>
                </select>
            </div>
            <div class="field">
                <label for="color">color</label>
                <select id="color">
                    <option value="D">D</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="G">G</option>
                    <option value="H">H</option>
                    <option value="I">I</option>
                    <option value="J">J</option>
                </select>
            </div>
            <div class="field">
                <label for="clarity">clarity</label>
                <select id="clarity">
                    <option value="I1">I1</option>
                    <option value="SI2">SI2</option>
                    <option value="SI1">SI1</option>
                    <option value="VS2">VS2</option>
                    <option value="VS1">VS1</option>
                    <option value="VVS2">VVS2</option>
                    <option value="VVS1">VVS1</option>
                    <option value="IF">IF</option>
                </select>
            </div>
            <div class="field">
                <label for="depth">depth (43 - 79)</label>
                <input type="number" id="depth" min="43" max="79" step="0.01">
            </div>
            <div class="field">
                <label for="table">table (43 - 95)</label>
                <input type="number" id="table" min="43" max="95" step="0.01">
            </div>
            <div class="field">
                <label for="x">x (0.1 - 10.7)</label>
                <input type="number" id="x" min="0.1" max="10.7" step="0.01">
            </div>
            <div class="field">
                <label for="y">y (0 - 58.9)</label>
                <input type="number" id="y" min="0" max="58.9" step="0.01">
            </div>
            <div class="field">
                <label for="z">z (0 - 31.8)</label>
                <input type="number" id="z" min="0" max="31.8" step="0.01">
            </div>
            <div class="field">
                <label for="predictedPrice">Predicted price</label>
                <input type="text" id="predictedPrice" readonly placeholder="Prediction result will appear here">
            </div>
        </div>

        <div class="actions">
            <button class="btn-predict" onclick="submitPredictionInput()">Predict</button>
            <button class="btn-clear" onclick="clearState()">Clear</button>
        </div>

        <div class="result" id="result">No data submitted yet.</div>
    </div>
</div>

<script>
    const FORM_KEY  = 'diamond_prediction_state';
    const CHART_KEY = 'diamond_chart_data';
    const TOKEN_KEY = 'diamond_startup_token';

    function saveState(payload, predictedPrice, resultText) {
        sessionStorage.setItem(FORM_KEY, JSON.stringify({ payload, predictedPrice, resultText }));
    }

    function loadState() {
        try {
            const raw = sessionStorage.getItem(FORM_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch { return null; }
    }

    function clearState() {
        sessionStorage.removeItem(FORM_KEY);
        ['carat','depth','table','x','y','z'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('cut').value     = 'Fair';
        document.getElementById('color').value   = 'D';
        document.getElementById('clarity').value = 'I1';
        document.getElementById('predictedPrice').value = '';
        document.getElementById('result').textContent   = 'No data submitted yet.';
    }

    function restoreForm(saved) {
        if (!saved) return;
        const p = saved.payload;
        if (p) {
            if (p.carat   != null) document.getElementById('carat').value   = p.carat;
            if (p.depth   != null) document.getElementById('depth').value   = p.depth;
            if (p.table   != null) document.getElementById('table').value   = p.table;
            if (p.x       != null) document.getElementById('x').value       = p.x;
            if (p.y       != null) document.getElementById('y').value       = p.y;
            if (p.z       != null) document.getElementById('z').value       = p.z;
            if (p.cut)     document.getElementById('cut').value     = p.cut;
            if (p.color)   document.getElementById('color').value   = p.color;
            if (p.clarity) document.getElementById('clarity').value = p.clarity;
        }
        if (saved.predictedPrice != null)
            document.getElementById('predictedPrice').value = saved.predictedPrice;
        if (saved.resultText)
            document.getElementById('result').textContent = saved.resultText;
    }

    async function initPage() {
        // ── Startup-token check ───────────────────────────────────────────────
        // Same logic as index.html — whichever page is loaded first after a
        // server restart clears ALL stored data for both pages.
        try {
            const res = await fetch('/api/startup-token');
            const { startedAt } = await res.json();
            const serverToken = String(startedAt);
            if (sessionStorage.getItem(TOKEN_KEY) !== serverToken) {
                sessionStorage.removeItem(FORM_KEY);
                sessionStorage.removeItem(CHART_KEY);
                sessionStorage.setItem(TOKEN_KEY, serverToken);
            }
        } catch (e) { /* proceed with whatever is stored */ }

        restoreForm(loadState());
    }

    function getNumberValue(id) {
        const value = document.getElementById(id).value;
        return value === "" ? null : parseFloat(value);
    }

    async function submitPredictionInput() {
        const payload = {
            carat:   getNumberValue("carat"),
            cut:     document.getElementById("cut").value,
            color:   document.getElementById("color").value,
            clarity: document.getElementById("clarity").value,
            depth:   getNumberValue("depth"),
            table:   getNumberValue("table"),
            x:       getNumberValue("x"),
            y:       getNumberValue("y"),
            z:       getNumberValue("z")
        };

        const sendingText = "Sending payload:\n" + JSON.stringify(payload, null, 2);
        document.getElementById("result").textContent = sendingText;

        try {
            const response = await fetch("/api/prediction-input", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const responseData = await response.json();

            if (!response.ok) {
                const errorMessage = responseData.message || "Prediction request failed.";
                throw new Error(errorMessage + "\n" + JSON.stringify(responseData, null, 2));
            }

            const predictedPrice = responseData.predictedPrice ?? "N/A";
            const resultText =
                "Prediction succeeded.\n" +
                "Predicted price: " + predictedPrice + "\n" +
                "Details:\n" + JSON.stringify(responseData, null, 2);

            document.getElementById("predictedPrice").value = predictedPrice;
            document.getElementById("result").textContent   = resultText;
            saveState(payload, predictedPrice, resultText);

        } catch (error) {
            const errorText = "Error while sending request:\n" + error;
            document.getElementById("result").textContent   = errorText;
            document.getElementById("predictedPrice").value = "Error";
            saveState(payload, "Error", errorText);
        }
    }

    initPage();
</script>
</body>
</html>
