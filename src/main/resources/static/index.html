<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diamond Prediction Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 16px 0;
            text-align: center;
            font-size: 2rem;
        }

        .status {
            margin-bottom: 24px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .chart-container {
            width: 100%;
            min-height: 420px;
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .chart-container h2 {
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 1.4rem;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 520px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
<h1>Diamond Price Prediction Dashboard</h1>
<div class="status" id="status">Connecting...</div>

<div class="dashboard">
    <div class="chart-container">
        <h2>Average Predicted Price vs Iteration</h2>
        <div class="chart-wrapper">
            <canvas id="avgPriceChart"></canvas>
        </div>
    </div>

    <div class="chart-container">
        <h2>RMSE vs Iteration</h2>
        <div class="chart-wrapper">
            <canvas id="rmseChart"></canvas>
        </div>
    </div>

    <div class="chart-container">
        <h2>R-Squared vs Iteration</h2>
        <div class="chart-wrapper">
            <canvas id="r2Chart"></canvas>
        </div>
    </div>
</div>

<script>
    const labels = [];
    const avgPriceData = [];
    const rmseData = [];
    const r2Data = [];

    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false
    };

    const avgPriceChart = new Chart(document.getElementById('avgPriceChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Average Predicted Price',
                data: avgPriceData,
                borderColor: 'blue',
                backgroundColor: 'rgba(0, 0, 255, 0.1)',
                tension: 0.2,
                fill: true
            }]
        },
        options: commonOptions
    });

    const rmseChart = new Chart(document.getElementById('rmseChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'RMSE',
                data: rmseData,
                borderColor: 'red',
                backgroundColor: 'rgba(255, 0, 0, 0.1)',
                tension: 0.2,
                fill: true
            }]
        },
        options: commonOptions
    });

    const r2Chart = new Chart(document.getElementById('r2Chart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'R²',
                data: r2Data,
                borderColor: 'green',
                backgroundColor: 'rgba(0, 255, 0, 0.1)',
                tension: 0.2,
                fill: true
            }]
        },
        options: commonOptions
    });

    function addPoint(message) {
        labels.push(message.iteration);
        avgPriceData.push(message.avg_predicted_price);
        rmseData.push(message.rmse);
        r2Data.push(message.r2);

        avgPriceChart.update();
        rmseChart.update();
        r2Chart.update();
    }

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {
        document.getElementById('status').innerText = 'Connected';
        stompClient.subscribe('/topic/predictions', function (payload) {
            const message = JSON.parse(payload.body);
            console.log('Received:', message);
            addPoint(message);
        });
    }, function () {
        document.getElementById('status').innerText = 'Connection failed';
    });
</script>
</body>
</html>
